<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bin Location Stock Report — Local JSON</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4fa;color:#163b54;font:16px system-ui,Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:12px}
header{font-size:clamp(23px,5vw,32px);font-weight:800;color:#075386;margin:10px 0 15px}
.panel{background:white;border:1px solid #d2e1eb;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #13334d0c}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input[type=text]{width:100%;font-size:19px;border:1px solid #a9c1d0;border-radius:9px;padding:14px;min-height:50px}
button,.filelabel{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:9px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer;background:#0876c9;color:white}
button.alt{background:#59758a}button.green{background:#07966b}button.orange{background:#db8119}.filelabel{background:#075386}#file{display:none}
.small{font-size:13px;color:#637e91}.status{margin:10px 0;color:#32627e;font-size:14px;overflow-wrap:anywhere}.error{color:#b42318}
#cameraArea{display:none;margin:12px 0}video{width:100%;max-height:42vh;background:#111;border-radius:10px}.cameraBox{position:relative}.aim{position:absolute;left:8%;right:8%;top:42%;height:16%;border:3px solid #00dc91;border-radius:8px;box-shadow:0 0 0 999px #0003;pointer-events:none}.aim:after{content:"CENTER THE PRINTED TEXT HERE";position:absolute;bottom:100%;left:0;background:#075386;color:white;font-size:11px;padding:3px 6px;border-radius:4px}
h2{margin:0 0 8px;font-size:21px}.meta{color:#5a7487;font-size:14px;margin:5px 0 15px}
.item{border:1px solid #d3e2eb;border-radius:10px;padding:12px;margin:12px 0;break-inside:avoid}.item h3{margin:0 0 10px;font-size:17px;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #d9e5eb;padding:7px 4px;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#eaf3f9}tfoot{font-weight:800;background:#e5f3f8}
.total{background:#e6f3fb;border-radius:9px;padding:12px;margin:12px 0;font-weight:750}
#report{min-height:110px}.hidden{display:none!important}.suggestions{margin:10px 0;display:grid;gap:7px}.suggestions button{width:100%;text-align:left;justify-content:space-between;background:#e7f3fb;color:#075386;border:1px solid #9cc7df;font-size:19px;padding:12px 14px}.suggestions button:active{background:#bfe5fc}.suggestions .hint{font-size:12px;color:#526d7c}.suggestions-title{font-weight:700;margin:8px 0 5px}
@media(max-width:550px){.wrap{padding:9px}.panel{padding:12px}.row button{flex:1}th,td{font-size:12px;padding:7px 3px}}
@media print{body{background:white}.wrap{max-width:none}.panel{box-shadow:none;border:0;padding:0}.controls,.status,#cameraArea{display:none!important}.item{break-inside:avoid}header{font-size:23px}}

/* Mobile-first scanner overlay: camera and choices remain visible without scrolling page */
#cameraArea{display:none;position:fixed;inset:0;z-index:1000;background:#f4f8fb;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);overflow:hidden;flex-direction:column;gap:7px}
#cameraArea.active{display:flex!important}body.cameraOpen{overflow:hidden}
.cameraTop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}.cameraTop button{padding:9px 12px}

.cameraBox video{height:100%;width:100%;max-height:none;object-fit:cover}
.aim{left:8%;right:8%;top:42%;height:16%}.aim:after{content:'PRINTED LOCATION CODE';font-size:10px}
#ocrDebug{font-size:12px;min-height:20px;margin:0;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choicesHead{font-size:14px;font-weight:800;flex:none}

#suggestions button.top-choice .hint{color:#e5fff4;font-weight:800}
header{margin:3px 0 8px;font-size:24px}.panel{padding:12px}.wrap{padding:8px}.status{margin:6px 0}
@media(min-width:750px){#cameraArea{left:50%;right:auto;transform:translateX(-50%);width:min(540px,100%);box-shadow:0 0 0 100vw #0009}}
@media(max-height:680px){.cameraBox{height:34dvh}#suggestions button{min-height:44px;padding:6px}}
</style></head><body><main class="wrap">
<header>📍 Bin Stock</header>
<section class="panel controls">
<div class="row">
<label class="filelabel" for="file">📁 Import Inventory JSON</label><input id="file" type="file" accept=".json,application/json"> <button id="clear" class="alt" type="button" style="background:#e8eef2;color:#375469;font-size:12px;padding:9px">Delete saved backup</button>

</div>
<div class="status" id="importStatus">Import backup to start.</div>

<hr style="border:0;border-top:1px solid #e1eaf0;margin:15px 0">
<label for="bin"><strong>Bin location</strong></label>
<input id="bin" type="text" placeholder="Scan / type bin location, e.g. G-G29-L04" autocomplete="off" autocapitalize="characters" list="bins">
<datalist id="bins"></datalist>
<div class="row" style="margin-top:10px">
<button id="scan">📷 Camera</button>
<button class="green" id="csv">⬇ Excel CSV</button>
<button class="orange" id="print">🖨 Print</button>
<button id="saveImage" type="button" style="background:#6547a7">📸 Save Full Report</button>
</div>
<div id="cameraArea" role="dialog" aria-modal="true" aria-label="Scan location"><div class="cameraTop"><strong>Scan location text</strong><button class="alt" id="stop" type="button">✕ Close</button></div><div class="cameraBox"><video id="video" autoplay muted playsinline></video><div class="aim"></div></div><div class="status" id="ocrDebug">Point at printed code</div><div class="choicesHead">Tap the correct location:</div><div id="suggestions" class="suggestions" aria-live="polite"></div></div>
<div class="status" id="scanStatus"></div>
</section>
<section class="panel" id="report"><h2>Stock Report</h2><p class="meta">Import JSON, then scan or select a bin.</p></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let candidateHistory=new Map();
let snapshot=null, rows=[], validBins=new Set(), stream=null, frame=0, scanning=false, busy=false, timer=0, scanCandidate='', scanCount=0, ocrWorker=null, scanSession=0, suggestionSignature='';
const code=x=>String(x??'').trim().toUpperCase();
const num=x=>Number(x)||0;
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>Number(x).toLocaleString('en-US',{maximumFractionDigits:3});
function status(message,error=false){$('scanStatus').textContent=message;$('scanStatus').className='status'+(error?' error':'')}
function quantity(r){return (r.rows||[]).slice(0,4).reduce((a,z)=>a+num(z.subtotal),0)}
function locationRows(loc){return (snapshot?.stock||[]).filter(r=>code(r.location)===loc&&quantity(r)>0).sort((a,b)=>String(a.item).localeCompare(String(b.item)))}
function uom(item){return /(?:^|[-_ ])(?:OIL)(?:[-_ ]|$)/i.test(item)?'KG':'PCS'}
function render(loc){
 if(!snapshot){$('report').innerHTML='<h2>Stock Report</h2><p class="meta">Import your Inventory JSON first.</p>';return}
 if(!validBins.has(loc)){$('report').innerHTML='<h2>Stock Report</h2><p class="meta">Choose or scan a bin location from the imported backup.</p>';return}
 rows=locationRows(loc);
 const byUom={};rows.forEach(r=>{const u=uom(r.item);byUom[u]=(byUom[u]||0)+quantity(r)});
 let out='<h2>Bin Location: '+escapeHTML(loc)+'</h2><div class="meta">Positive Balance SKU: '+rows.length+' · Backup date: '+escapeHTML(snapshot.exportedAt||'Unknown')+'</div>';
 for(let i=0;i<rows.length;i++){
  const r=rows[i],size=Array.from({length:4},(_,n)=>r.rows?.[n]||{});
  out+='<article class="item"><h3>'+(i+1)+'. '+escapeHTML(r.item)+' <span class="small">('+uom(r.item)+')</span></h3><table><thead><tr><th>Size</th><th>CTN</th><th>Qty / CTN</th><th>Subtotal</th></tr></thead><tbody>';
  for(let j=0;j<4;j++)out+='<tr><td>Size '+(j+1)+'</td><td>'+fmt(size[j].ctn)+'</td><td>'+fmt(size[j].qty)+'</td><td>'+fmt(size[j].subtotal)+'</td></tr>';
  out+='</tbody><tfoot><tr><th colspan="3">ITEM TOTAL</th><th>'+fmt(quantity(r))+'</th></tr></tfoot></table></article>';
 }
 if(!rows.length)out+='<p>No positive stock in this bin in the imported snapshot.</p>';
 out+='<div class="total">Positive Balance SKU: '+rows.length+' | Totals by UOM: '+(Object.entries(byUom).map(([u,v])=>u+' '+fmt(v)).join(' · ')||'0')+'</div>';
 $('report').innerHTML=out;
 status('Showing current balance from imported backup for '+loc);
}
function selectBin(value){
 const loc=code(value);$('bin').value=loc;
 if(!snapshot){render(loc);status('Import inventory JSON first.',true);return false}
 if(!validBins.has(loc)){render(loc);status('Unknown bin location in imported backup: '+loc,true);return false}
 render(loc);return true;
}
$('bin').addEventListener('input',()=>{
 clearTimeout(timer);const loc=code($('bin').value);
 if(validBins.has(loc))timer=setTimeout(()=>selectBin(loc),90);
 else{rows=[];render('');if(loc)status('No matching bin yet. Select a known location.',true)}
});
$('bin').addEventListener('change',()=>{if(validBins.has(code($('bin').value)))selectBin($('bin').value)});
$('bin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectBin($('bin').value)}});
// Keep the last successful inventory snapshot on this device across browser restarts.
const DB_NAME='bin-stock-local-v1', STORE='backups', RECORD='active';
function openBackupDB(){return new Promise((resolve,reject)=>{
 if(!window.indexedDB){reject(Error('Local storage is unavailable in this browser.'));return}
 const req=indexedDB.open(DB_NAME,1);
 req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('Database open failed'));
})}
async function backupAction(mode,value){
 const db=await openBackupDB();
 try{return await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,mode==='get'?'readonly':'readwrite');
  const store=tx.objectStore(STORE);
  const req=mode==='get'?store.get(RECORD):mode==='put'?store.put(value,RECORD):store.delete(RECORD);
  let result;
  req.onsuccess=()=>{result=req.result};req.onerror=()=>reject(req.error||Error('Storage operation failed'));
  tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error||Error('Storage transaction failed'));
 })}finally{db.close()}
}
function installBackup(data){
 if(data.format!=='inventory-portable-backup'||!data.state||!Array.isArray(data.state.stock))throw Error('Unsupported Inventory FULL Backup JSON.');
 const next={stock:data.state.stock,exportedAt:data.exportedAt||''};
 const bins=new Set(next.stock.map(r=>code(r.location)).filter(Boolean));
 (data.state.extraLocations||[]).forEach(x=>{const k=code(typeof x==='string'?x:(x.code||x.location));if(k)bins.add(k)});
 snapshot=next;validBins=bins;rows=[];
 $('bins').innerHTML=Array.from(validBins).sort().map(k=>'<option value="'+escapeHTML(k)+'"></option>').join('');
 $('importStatus').className='status';
 const loc=code($('bin').value);if(validBins.has(loc))selectBin(loc);else render('');
 return bins.size;
}
$('file').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 $('importStatus').textContent='Loading backup…';$('importStatus').className='status';
 try{
  const raw=await file.text();const data=JSON.parse(raw);
  if(data.format!=='inventory-portable-backup'||!data.state||!Array.isArray(data.state.stock))throw Error('Unsupported Inventory FULL Backup JSON.');
  // Persist first: a failed save must not replace the previous working backup.
  await backupAction('put',raw);
  const count=installBackup(data);
  $('importStatus').textContent='✓ Saved on this device · '+count+' locations · '+(data.exportedAt||'');
 }catch(err){$('importStatus').textContent='Import/save failed: '+err.message+'. Previous backup remains available if already loaded.';$('importStatus').className='status error'}
 finally{$('file').value=''}
});
async function restoreSavedBackup(){
 $('importStatus').textContent='Checking saved inventory…';
 try{
  const raw=await backupAction('get');
  if(!raw){$('importStatus').textContent='Import backup once to save it on this device.';return}
  const data=JSON.parse(raw);const count=installBackup(data);
  $('importStatus').textContent='✓ Saved backup ready · '+count+' locations · '+(data.exportedAt||'');
 }catch(err){$('importStatus').textContent='Could not restore saved backup: '+err.message;$('importStatus').className='status error'}
}
restoreSavedBackup();

function stopCamera(){
 scanSession++;scanCandidate='';scanCount=0;scanning=false;
 if(frame)clearTimeout(frame);frame=0;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 const v=$('video');v.pause();v.srcObject=null;$('cameraArea').classList.remove('active');document.body.classList.remove('cameraOpen');
}
$('stop').onclick=stopCamera;
// Match OCR against ONLY real locations from the imported JSON. Never invent a bin.
// The expected format is LETTER-LETTER+2 DIGITS-L+2 DIGITS, e.g. G-G32-L07.
const binPattern=/^[A-Z]-[A-Z]\d{2}-L\d{2}$/;
const flat=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function charCost(a,b,position){
 if(a===b)return 0;
 // Positions 0,1,4 must be letters; 2,3,5,6 must be digits.
 const letter=position===0||position===1||position===4;
 const confusing=['O0','I1','L1','S5','B8','Z2','G6','T7','Q0','D0'];
 if(confusing.some(pair=>pair.includes(a)&&pair.includes(b)))return 0.42;
 if(letter && /[A-Z]/.test(a) && /[A-Z]/.test(b))return 1.25;
 if(!letter && /[0-9]/.test(a) && /[0-9]/.test(b))return 1.25;
 return 2.5;
}
function scoreCode(sample,known){
 const target=flat(known);
 if(sample.length!==7||target.length!==7)return 999;
 let score=0;
 for(let i=0;i<7;i++)score+=charCost(sample[i],target[i],i);
 return score;
}
function ocrCandidates(raw){
 const normalized=String(raw||'').toUpperCase().replace(/[‐‑‒–—−_]/g,'-');
 const sequences=[];
 for(const line of normalized.split(/\n/)){
  const chunks=line.match(/[A-Z0-9][A-Z0-9\s-]{3,28}[A-Z0-9]/g)||[];
  for(const chunk of chunks){
   const value=flat(chunk);
   if(value.length>=7 && value.length<=16){
    for(let i=0;i<=value.length-7;i++)sequences.push(value.slice(i,i+7));
   }
  }
 }
 // Don't display choices when the OCR read only isolated letters or unrelated text.
 if(!sequences.length)return [];
 const best=new Map();
 for(const known of validBins){
  if(!binPattern.test(known))continue;
  const sc=Math.min(...sequences.map(seq=>scoreCode(seq,known)));
  if(sc<=2.1)best.set(known,sc);
 }
 return [...best].sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0])).slice(0,6);
}
function showChoices(matches){
 for(const [loc,score] of matches){const old=candidateHistory.get(loc);candidateHistory.set(loc,{score:Math.min(score,old?.score??999),seen:(old?.seen||0)+1});}
 if(candidateHistory.size>30){const sorted=[...candidateHistory].sort((a,b)=>a[1].score-b[1].score||b[1].seen-a[1].seen).slice(0,20);candidateHistory=new Map(sorted)}
 matches=[...candidateHistory].sort((a,b)=>a[1].score-b[1].score||b[1].seen-a[1].seen).slice(0,6).map(([loc,x])=>[loc,x.score]);
 const signature=matches.map(([loc,score])=>loc+':'+score.toFixed(2)).join('|');
 if(signature===suggestionSignature)return;
 suggestionSignature=signature;
 const el=$('suggestions');el.replaceChildren();
 if(!matches.length){el.textContent='Waiting for location text…';return}
 
 for(const [index,[loc,score]] of matches.entries()){
  const btn=document.createElement('button');btn.type='button';
  if(index===0)btn.classList.add('top-choice');
  const name=document.createElement('strong');name.textContent=loc;
  const hint=document.createElement('span');hint.className='hint';hint.textContent=index===0?(score<0.1?'★ Best · Exact match':'★ Best match'):(score<0.1?'Exact OCR match':'Possible match');
  btn.append(name,hint);
  btn.addEventListener('click',()=>{stopCamera();selectBin(loc);$('suggestions').replaceChildren();suggestionSignature='';$('report').scrollIntoView({behavior:'smooth',block:'start'});});
  el.append(btn);
 }
}
async function loadOCR(){
 if(window.Tesseract)return;
 await new Promise((resolve,reject)=>{
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  s.onload=resolve;s.onerror=()=>reject(new Error('OCR library could not load. Check internet connection.'));
  document.head.appendChild(s);
 });
}
$('scan').onclick=async()=>{
 if(!snapshot||!validBins.size){status('Import Inventory JSON before using the camera.',true);return}
 if(scanning){stopCamera();return}
 candidateHistory.clear();suggestionSignature='';$('suggestions').replaceChildren();
 if(!navigator.mediaDevices?.getUserMedia){status('Camera requires HTTPS and a compatible browser.',true);return}
 const session=++scanSession;
 try{
  status('Loading text recognition (OCR) for the first time. Internet required...');
  await loadOCR();if(session!==scanSession)return;
  if(!ocrWorker){ocrWorker=await Tesseract.createWorker('eng',1);await ocrWorker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',tessedit_pageseg_mode:'6'});}
  if(session!==scanSession)return;
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  const v=$('video');v.srcObject=stream;$('cameraArea').classList.add('active');document.body.classList.add('cameraOpen');await v.play();scanning=true;
  status('');
  const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d',{willReadFrequently:true});
  async function readFrame(){
   if(!scanning||session!==scanSession)return;
   try{
    const w=v.videoWidth,h=v.videoHeight;
    if(w&&h){
     // Crop center strip where printed location text should be placed.
     const cropX=Math.round(w*0.08),cropW=Math.round(w*0.84);
     const cropY=Math.round(h*0.42),cropH=Math.round(h*0.16);
     canvas.width=1800;canvas.height=Math.max(100,Math.round(1800*cropH/cropW));
     ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
     ctx.filter='grayscale(1) contrast(2.4)';ctx.drawImage(v,cropX,cropY,cropW,cropH,0,0,canvas.width,canvas.height);ctx.filter='none';
     const result=await ocrWorker.recognize(canvas);
     if(!scanning||session!==scanSession)return;
     const raw=String(result.data.text||'').trim();
     $('ocrDebug').textContent='Camera sees: '+(raw.replace(/\s+/g,' ').slice(0,90)||'(no text detected)');
     const matches=ocrCandidates(raw);
     showChoices(matches);

    }
   }catch(e){status('Text recognition retrying: '+e.message,true)}
   if(scanning&&session===scanSession)frame=setTimeout(readFrame,350);
  }
  readFrame();
 }catch(e){stopCamera();status('Unable to start OCR camera: '+e.message,true)}
};
$('clear').onclick=async()=>{if(!confirm('Delete saved inventory backup from this device?'))return;try{await backupAction('delete');stopCamera();$('suggestions').replaceChildren();suggestionSignature='';snapshot=null;rows=[];validBins.clear();$('bins').innerHTML='';$('bin').value='';$('importStatus').textContent='Saved backup deleted.';render('');status('Import JSON to begin.')}catch(e){status('Could not delete saved backup: '+e.message,true)}};
// Save only the full report panel as a single long WebP image (not the visible viewport).
// html2canvas renders locally: no report data is uploaded.
let imageSaving=false;
function loadScreenshotLibrary(){
 if(window.html2canvas)return Promise.resolve();
 return new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=resolve;s.onerror=()=>reject(Error('Image library could not load. Check internet connection.'));
  document.head.appendChild(s);
 });
}
$('saveImage').onclick=async()=>{
 if(imageSaving)return;
 const loc=code($('bin').value);
 if(!snapshot||!validBins.has(loc)){status('Select a bin location first.',true);return}
 imageSaving=true;const button=$('saveImage');button.disabled=true;button.textContent='⏳ Saving...';
 try{
  await loadScreenshotLibrary();
  const target=$('report');
  const width=Math.ceil(target.scrollWidth),height=Math.ceil(target.scrollHeight);
  const maxPixels=12000000,maxSide=15000;
  const scale=Math.min(1.6,Math.sqrt(maxPixels/(width*height)),maxSide/height,maxSide/width);
  if(scale<0.25)throw Error('Report is too long for one image on this phone. Use Print → Save as PDF.');
  const canvas=await html2canvas(target,{backgroundColor:'#ffffff',scale:Math.max(0.25,scale),useCORS:false,logging:false,scrollX:0,scrollY:-window.scrollY,windowWidth:document.documentElement.clientWidth});
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.78));
  if(!blob)throw Error('Image creation failed on this device.');
  const isWebP=blob.type==='image/webp';
  const now=new Date();const stamp=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
  const filename=loc+'_'+stamp+'.'+(isWebP?'webp':'png');
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  status('Image saved to browser downloads: '+filename+'. Move it to your Review Results folder in My Files if needed.');
 }catch(e){status('Image save failed: '+e.message,true)}
 finally{imageSaving=false;button.disabled=false;button.textContent='📸 Save Full Report'}
};
$('print').onclick=()=>{if(snapshot&&validBins.has(code($('bin').value)))window.print();else status('Choose a bin after importing JSON.',true)};
$('csv').onclick=()=>{
 const loc=code($('bin').value);if(!snapshot||!validBins.has(loc)){status('Choose a bin after importing JSON.',true);return}
 const cells=[['Bin Location','Item Code','UOM','Size','CTN','Qty / CTN','Subtotal','Item Total']];
 locationRows(loc).forEach(r=>{const z=Array.from({length:4},(_,i)=>r.rows?.[i]||{});z.forEach((s,i)=>cells.push([loc,r.item,uom(r.item),'Size '+(i+1),num(s.ctn),num(s.qty),num(s.subtotal),i===3?quantity(r):'']))});
 const csv='\ufeff'+cells.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Bin_Location_'+loc+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
</script></body></html>
