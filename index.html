let snapshot=null, rows=[], validBins=new Set(), stream=null, frame=0, scanning=false, busy=false, timer=0, scanCandidate='', scanCount=0, ocrWorker=null, scanSession=0, suggestionSignature='';
const code=x=>String(x??'').trim().toUpperCase();

const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>Number(x).toLocaleString('en-US',{maximumFractionDigits:3});
const inspectionTimeFormat=d=>new Intl.DateTimeFormat('en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(d);

function status(message,error=false){$('scanStatus').textContent=message;$('scanStatus').className='status'+(error?' error':'')}
function quantity(r){return (r.rows||[]).slice(0,4).reduce((a,z)=>a+num(z.subtotal),0)}
function locationRows(loc){return (snapshot?.stock||[]).filter(r=>code(r.location)===loc&&quantity(r)>0).sort((a,b)=>String(a.item).localeCompare(String(b.item)))}
function uom(item){return /(?:^|[-_ ])(?:OIL)(?:[-_ ]|$)/i.test(item)?'KG':'PCS'}
function render(loc){
 if(!snapshot){$('report').innerHTML='<h2>Stock Report</h2><p class="meta">Import your Inventory JSON first.</p>';return}
 if(!validBins.has(loc)){inspectionBin='';inspectionStamp='';$('report').innerHTML='<h2>Stock Report</h2><p class="meta">Choose or scan a bin location from the imported backup.</p>';return}
 if(inspectionBin!==loc||!inspectionStamp){inspectionBin=loc;inspectionStamp=inspectionTimeFormat(new Date())}
 rows=locationRows(loc);
 const byUom={};rows.forEach(r=>{const u=uom(r.item);byUom[u]=(byUom[u]||0)+quantity(r)});
 let out='<h2>Bin Location: '+escapeHTML(loc)+'</h2><div class="meta">Positive Balance SKU: '+rows.length+' · Backup date: '+escapeHTML(snapshot.exportedAt||'Unknown')+'</div><div class="meta" style="font-weight:750;color:#174b70">Inspection date &amp; time (AM/PM): '+escapeHTML(inspectionStamp)+'</div>';
 for(let i=0;i<rows.length;i++){
  const r=rows[i],size=Array.from({length:4},(_,n)=>r.rows?.[n]||{});
  out+='<article class="item"><h3>'+(i+1)+'. '+escapeHTML(r.item)+' <span class="small">('+uom(r.item)+')</span></h3><div style="font-size:15px;font-weight:650;margin:-3px 0 10px;overflow-wrap:anywhere">'+escapeHTML(itemDescription(r.item))+'</div><table><thead><tr><th>Size</th><th>CTN</th><th>Qty / CTN</th><th>Subtotal</th></tr></thead><tbody>';
  for(let j=0;j<4;j++)out+='<tr><td>Size '+(j+1)+'</td><td>'+fmt(size[j].ctn)+'</td><td>'+fmt(size[j].qty)+'</td><td>'+fmt(size[j].subtotal)+'</td></tr>';
  out+='</tbody><tfoot><tr><th colspan="3">ITEM TOTAL</th><th>'+fmt(quantity(r))+'</th></tr></tfoot></table></article>';
 }
 if(!rows.length)out+='<p>No positive stock in this bin in the imported snapshot.</p>';
 out+='<div class="total">Positive Balance SKU: '+rows.length+' | Totals by UOM: '+(Object.entries(byUom).map(([u,v])=>u+' '+fmt(v)).join(' · ')||'0')+'</div>';
 $('report').innerHTML=out;

 if(!binMatches.length){closeBinMatches();return}

 binMatches.forEach((loc,i)=>{

  if(i===binHighlight)b.classList.add('selected');

  name.append(document.createTextNode(loc.slice(0,idx)));

  b.addEventListener('pointerdown',e=>e.preventDefault());

// Keep the last successful inventory snapshot on this device across browser restarts.
const DB_NAME='bin-stock-local-v1', STORE='backups', RECORD='active';
const CATALOG_RECORD='item-descriptions';
async function catalogStore(mode,value){const db=await openBackupDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode==='get'?'readonly':'readwrite');const req=mode==='get'?tx.objectStore(STORE).get(CATALOG_RECORD):tx.objectStore(STORE).put(value,CATALOG_RECORD);let result;req.onsuccess=()=>result=req.result;req.onerror=()=>reject(req.error);tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
function applyCatalog(data){if(!Array.isArray(data.items))throw Error('Invalid item descriptions file');let count=0;for(const x of data.items){if(!x||!x.desc)continue;for(const k of [x.barcode,x.ref])if(k){itemDescriptions.set(code(k),String(x.desc));count++}}return count}
$('catalogFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=await file.text();const data=JSON.parse(raw);if(data.format!=='inventory-item-descriptions')throw Error('Choose Inventory_Item_Descriptions_Import_Once.json');await catalogStore('put',raw);const n=applyCatalog(data);$('importStatus').textContent='✓ Item descriptions saved locally ('+n+' mappings)';const loc=code($('bin').value);if(validBins.has(loc))render(loc)}catch(err){$('importStatus').textContent='Descriptions import failed: '+err.message}finally{$('catalogFile').value=''}});
// Built-in current catalog takes precedence over previously saved obsolete catalog files.
// Users can still explicitly import a replacement catalog using the button above.
function openBackupDB(){return new Promise((resolve,reject)=>{
 if(!window.indexedDB){reject(Error('Local storage is unavailable in this browser.'));return}
 const req=indexedDB.open(DB_NAME,1);
 req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('Database open failed'));
})}
async function backupAction(mode,value){
 const db=await openBackupDB();
 try{return await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,mode==='get'?'readonly':'readwrite');
  const store=tx.objectStore(STORE);
  const req=mode==='get'?store.get(RECORD):mode==='put'?store.put(value,RECORD):store.delete(RECORD);
  let result;
  req.onsuccess=()=>{result=req.result};req.onerror=()=>reject(req.error||Error('Storage operation failed'));
  tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error||Error('Storage transaction failed'));
 })}finally{db.close()}
}
function installBackup(data){
 if(data.format!=='inventory-portable-backup'||!data.state||!Array.isArray(data.state.stock))throw Error('Unsupported Inventory FULL Backup JSON.');
 const next={stock:data.state.stock,exportedAt:data.exportedAt||''};
 const bins=new Set(next.stock.map(r=>code(r.location)).filter(Boolean));
 (data.state.extraLocations||[]).forEach(x=>{const k=code(typeof x==='string'?x:(x.code||x.location));if(k)bins.add(k)});
 for(const x of (data.state.extraItems||[])){if(x&&x.desc)for(const k of [x.barcode,x.ref])if(k)itemDescriptions.set(code(k),String(x.desc))}
 for(const [k,e] of Object.entries(data.state.itemEdits||{})){if(e&&typeof e.desc==='string'&&e.desc.trim())itemDescriptions.set(code(k),e.desc.trim())}
  snapshot=next;validBins=bins;rows=[];
 paintBinMatches();
 $('importStatus').className='status';
 const loc=code($('bin').value);if(validBins.has(loc))selectBin(loc);else render('');
 return bins.size;
}
$('file').addEventListener('change',async e=>{

 $('importStatus').textContent='Loading backup…';$('importStatus').className='status';
 try{
  const raw=await file.text();const data=JSON.parse(raw);
  if(data.format!=='inventory-portable-backup'||!data.state||!Array.isArray(data.state.stock))throw Error('Unsupported Inventory FULL Backup JSON.');
  // Persist first: a failed save must not replace the previous working backup.
  await backupAction('put',raw);
  const count=installBackup(data);
  $('importStatus').textContent='✓ Saved on this device · '+count+' locations · '+(data.exportedAt||'');
 }catch(err){$('importStatus').textContent='Import/save failed: '+err.message+'. Previous backup remains available if already loaded.';$('importStatus').className='status error'}
 finally{$('file').value=''}
});

$('stop').onclick=stopCamera;
// Strict location grammar: L-LNN-LNN. Only imported locations are eligible.
const binPattern=/^[A-Z]-[A-Z][0-9]{2}-[A-Z][0-9]{2}$/;
const flat=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const letterPositions=new Set([0,1,4]);
const substitutions={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',B:'8',G:'6',T:'7',A:'4'};
const digitToLetter={'0':['O','Q','D'],'1':['I','L'],'2':['Z'],'5':['S'],'6':['G'],'8':['B'],'7':['T'],'4':['A']};
function charCost(a,b,pos){
 if(a===b)return 0;
 const isLetter=letterPositions.has(pos);
 if(isLetter){
  if(/[0-9]/.test(a)&&digitToLetter[a]?.includes(b))return .3;
  if(/[A-Z]/.test(a)&&/[A-Z]/.test(b))return 1.7;
  return 3.5;
 }
 if(/[A-Z]/.test(a)&&substitutions[a]===b)return .3;
 if(/[0-9]/.test(a)&&/[0-9]/.test(b))return 1.7;
 return 3.5;
}
function scoreCode(sample,known){
 const target=flat(known);if(sample.length!==7||target.length!==7)return 999;
 let score=0;for(let i=0;i<7;i++)score+=charCost(sample[i],target[i],i);
 return score;
}
function ocrCandidates(raw){
 const normalized=String(raw||'').toUpperCase().replace(/[‐‑‒–—−_]/g,'-');
 const sequences=[];
 // Prefer OCR snippets that retain the two dashes of the actual label.
 for(const line of normalized.split(/\n/)){
  const explicit=line.match(/[A-Z0-9]\s*-\s*[A-Z0-9]\s*[A-Z0-9]\s*[A-Z0-9]\s*-\s*[A-Z0-9]\s*[A-Z0-9]\s*[A-Z0-9]/g)||[];
  for(const chunk of explicit)sequences.push({value:flat(chunk),bonus:0});
  // OCR sometimes loses dashes; inspect 7-character sequences without guessing from long unrelated text.
  for(const chunk of line.match(/[A-Z0-9]{7,10}/g)||[]){
   for(let i=0;i<=chunk.length-7;i++)sequences.push({value:chunk.slice(i,i+7),bonus:.5});
  }
 }
 if(!sequences.length)return [];
 const best=[];
 for(const known of validBins){
  if(!binPattern.test(known))continue;
  let sc=999;
  for(const seq of sequences)sc=Math.min(sc,scoreCode(seq.value,known)+seq.bonus);
  if(sc<=2.2)best.push([known,sc]);
 }
 return best.sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0])).slice(0,6);
}
function showChoices(matches){
 // Latest frame matters more than old wrong readings; keep only a short moving window.
 for(const [loc,score] of matches){const old=candidateHistory.get(loc);candidateHistory.set(loc,{score:Math.min(score,old?.score??999),seen:(old?.seen||0)+1,last:Date.now()});}
 const now=Date.now();for(const [loc,rec] of candidateHistory)if(now-rec.last>4500)candidateHistory.delete(loc);
 matches=[...candidateHistory].sort((a,b)=>a[1].score-b[1].score||b[1].seen-a[1].seen).slice(0,6).map(([loc,x])=>[loc,x.score]);
 const signature=matches.map(([loc,score])=>loc+':'+score.toFixed(2)).join('|');
 if(signature===suggestionSignature)return;
 suggestionSignature=signature;
 const el=$('suggestions');el.replaceChildren();
 if(!matches.length){el.textContent='Point at the printed location code';return}
 for(const [index,[loc,score]] of matches.entries()){
  const btn=document.createElement('button');btn.type='button';
  if(index===0)btn.classList.add('top-choice');
  const name=document.createElement('strong');name.textContent=loc;
  const hint=document.createElement('span');hint.className='hint';hint.textContent=index===0?'★ Best match':'Possible match';
  btn.append(name,hint);
  btn.addEventListener('click',()=>{stopCamera();selectBin(loc);$('suggestions').replaceChildren();suggestionSignature='';$('report').scrollIntoView({behavior:'smooth',block:'start'});});
  el.append(btn);
 }
}
async function loadOCR(){
 if(window.Tesseract)return;
 await new Promise((resolve,reject)=>{
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  s.onload=resolve;s.onerror=()=>reject(new Error('OCR library could not load. Check internet connection.'));
  document.head.appendChild(s);
 });
}
$('scan').onclick=async()=>{
 if(!snapshot||!validBins.size){status('Import Inventory JSON before using the camera.',true);return}
 if(scanning){stopCamera();return}
 candidateHistory.clear();suggestionSignature='';$('suggestions').replaceChildren();
 if(!navigator.mediaDevices?.getUserMedia){status('Camera requires HTTPS and a compatible browser.',true);return}
 const session=++scanSession;
 try{
  status('Loading text recognition (OCR) for the first time. Internet required...');
  await loadOCR();if(session!==scanSession)return;
  if(!ocrWorker){ocrWorker=await Tesseract.createWorker('eng',1);await ocrWorker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',tessedit_pageseg_mode:'6'});}
  if(session!==scanSession)return;
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  const v=$('video');v.srcObject=stream;$('cameraArea').classList.add('active');document.body.classList.add('cameraOpen');await v.play();scanning=true;
  status('');
  const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d',{willReadFrequently:true});
  async function readFrame(){
   if(!scanning||session!==scanSession)return;
   try{
    const w=v.videoWidth,h=v.videoHeight;
    if(w&&h){
     // Crop center strip where printed location text should be placed.
     const cropX=Math.round(w*0.08),cropW=Math.round(w*0.84);
     const cropY=Math.round(h*0.42),cropH=Math.round(h*0.16);
     canvas.width=1800;canvas.height=Math.max(100,Math.round(1800*cropH/cropW));
     ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
     ctx.filter='grayscale(1) contrast(2.4)';ctx.drawImage(v,cropX,cropY,cropW,cropH,0,0,canvas.width,canvas.height);ctx.filter='none';
     const result=await ocrWorker.recognize(canvas);
     if(!scanning||session!==scanSession)return;
     const raw=String(result.data.text||'').trim();
     $('ocrDebug').textContent='Camera sees: '+(raw.replace(/\s+/g,' ').slice(0,90)||'(no text detected)');
     const matches=ocrCandidates(raw);
     showChoices(matches);

    }
   }catch(e){status('Text recognition retrying: '+e.message,true)}
   if(scanning&&session===scanSession)frame=setTimeout(readFrame,350);
  }
  readFrame();
 }catch(e){stopCamera();status('Unable to start OCR camera: '+e.message,true)}
};
$('clear').onclick=async()=>{if(!confirm('Delete saved inventory backup from this device?'))return;try{await backupAction('delete');stopCamera();$('suggestions').replaceChildren();suggestionSignature='';snapshot=null;rows=[];validBins.clear();closeBinMatches();binList.replaceChildren();$('bin').value='';$('importStatus').textContent='Saved backup deleted.';render('');status('Import JSON to begin.')}catch(e){status('Could not delete saved backup: '+e.message,true)}};
// Save the entire report as one JPEG image, with a persistent local serial number.
// html2canvas renders locally: no report data is uploaded.
let imageSaving=false;
function loadScreenshotLibrary(){
 if(window.html2canvas)return Promise.resolve();
 return new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=resolve;s.onerror=()=>reject(Error('Image library could not load. Check internet connection.'));
  document.head.appendChild(s);
 });
}
$('saveImage').onclick=async()=>{
 if(imageSaving)return;
 const loc=code($('bin').value);
 if(!snapshot||!validBins.has(loc)){status('Select a bin location first.',true);return}
 imageSaving=true;const button=$('saveImage');button.disabled=true;button.textContent='⏳ Saving...';
 try{
  await loadScreenshotLibrary();
  const target=$('report');
  const width=Math.ceil(target.scrollWidth),height=Math.ceil(target.scrollHeight);
  const maxPixels=12000000,maxSide=15000;
  const scale=Math.min(1.6,Math.sqrt(maxPixels/(width*height)),maxSide/height,maxSide/width);
  if(scale<0.25)throw Error('Report is too long for one image on this phone. Use Print → Save as PDF.');
  const canvas=await html2canvas(target,{backgroundColor:'#ffffff',scale:Math.max(0.25,scale),useCORS:false,logging:false,scrollX:0,scrollY:-window.scrollY,windowWidth:document.documentElement.clientWidth});
  // JPEG does not support transparency; html2canvas uses an opaque white background.
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.82));
  if(!blob||blob.type!=='image/jpeg')throw Error('JPG creation failed on this device.');
  const key='bin-stock-report-jpg-serial-v1';
  let previous=0;
  try{previous=Math.max(0,Number(localStorage.getItem(key))||0)}catch(e){throw Error('Browser storage is blocked. Allow site storage to keep serial numbers.');}
  const next=previous+1;
  const serial=String(next).padStart(4,'0');
  const now=new Date();
  const stamp=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+String(now.getSeconds()).padStart(2,'0');
  const filename=serial+'_'+loc+'_'+stamp+'.jpg';
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  localStorage.setItem(key,String(next));
  status('JPG report #' + serial + ' downloaded: ' + filename);
 }catch(e){status('Image save failed: '+e.message,true)}
 finally{imageSaving=false;button.disabled=false;button.textContent='📸 Save JPG Report'}
};
$('print').onclick=()=>{if(snapshot&&validBins.has(code($('bin').value)))window.print();else status('Choose a bin after importing JSON.',true)};
$('csv').onclick=()=>{
 const loc=code($('bin').value);if(!snapshot||!validBins.has(loc)){status('Choose a bin after importing JSON.',true);return}
 const cells=[['Bin Location','Item Code','Description','UOM','Size','CTN','Qty / CTN','Subtotal','Item Total']];
 locationRows(loc).forEach(r=>{const z=Array.from({length:4},(_,i)=>r.rows?.[i]||{});z.forEach((s,i)=>cells.push([loc,r.item,itemDescription(r.item),uom(r.item),'Size '+(i+1),num(s.ctn),num(s.qty),num(s.subtotal),i===3?quantity(r):'']))});
 const csv='\ufeff'+cells.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Bin_Location_'+loc+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
